[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demogen"
version = "0.1.0"
description = "Turn a YAML playbook and an author's intent into a narrated product-demo video."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saurabh Yadgire" }]
keywords = ["demo-video", "playwright", "langgraph", "llm", "computer-use", "tts"]
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "anthropic>=1.13",
  "litellm>=1.100",
  "numpy>=1.26",
  "opentelemetry-api>=1.27",
  "pillow>=10.1",
  "playwright>=1.59",
  "python-dotenv>=1",
  "pydantic>=2.9",
  "pyyaml>=6",
  "typer>=0.15",
  # The app (demogen ui) and the test shop (demogen shop).
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/yadgire7/demo-generator"
Issues = "https://github.com/yadgire7/demo-generator/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "opentelemetry-sdk>=1.27"]
# Running as a service: Postgres checkpoints and job queue, S3 artifacts, the HTTP API.
service = [
  "procrastinate>=3.5",
  "psycopg[binary,pool]>=3.2",
  "langgraph-checkpoint-postgres>=3",
  "boto3>=1.35",
]
# Tracing: the SDK and an OTLP exporter. Without it, tracing calls are no-ops.
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
# The default speech engines. Other engines are plugins and need neither.
voice = ["kokoro>=0.9.4", "faster-whisper>=1.2"]

[project.scripts]
demogen = "demogen.cli:app"

[project.entry-points."demogen.llm"]
anthropic = "demogen.llm.anthropic_provider:AnthropicProvider"
litellm = "demogen.llm.litellm_provider:LiteLLMProvider"

[project.entry-points."demogen.tts"]
kokoro = "demogen.voice.tts.kokoro:KokoroTTS"

[project.entry-points."demogen.stt"]
faster_whisper = "demogen.voice.stt.faster_whisper:FasterWhisperSTT"

[tool.hatch.build.targets.wheel]
packages = ["src/demogen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Noise from the speech model libraries, not from this project.
filterwarnings = [
  "ignore::DeprecationWarning:misaki.*",
  "ignore::FutureWarning:torch.*",
  "ignore::UserWarning:torch.*",
]
