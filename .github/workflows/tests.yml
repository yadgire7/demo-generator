# The test suite on Linux: browser tests in Chromium, ffmpeg for the editor, and Postgres
# (already on GitHub's Ubuntu runners) for the service tests. MinIO is not installed, so the
# S3 tests skip themselves; so do the speech-engine tests, which need the large `voice` extra.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install demogen
        run: pip install -e ".[dev,service]"

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run the tests
        run: pytest -q -rs
